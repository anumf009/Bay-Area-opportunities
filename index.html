<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bay Area Opportunities</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f8fc;color:#172033}
header{background:#172033;color:white;padding:56px 20px;text-align:center}
header h1{font-size:42px;margin:0 0 12px}header p{font-size:18px;margin:0 auto;max-width:700px;opacity:.9}
.container{max-width:1100px;margin:0 auto;padding:30px 20px}
.controls{background:white;padding:20px;border-radius:16px;box-shadow:0 3px 15px #00000012;display:grid;grid-template-columns:2fr repeat(4,1fr);gap:12px;margin-bottom:25px}
input,select{width:100%;padding:12px;border:1px solid #d7dbe5;border-radius:9px;background:white;font-size:14px}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:white;border-radius:16px;padding:20px;box-shadow:0 3px 15px #00000010;border:1px solid #eef0f5;display:flex;flex-direction:column}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.badge{font-size:12px;padding:5px 8px;border-radius:999px;background:#eef2ff}
.card h2{font-size:20px;margin:4px 0 8px}.org{font-weight:bold;font-size:14px;margin-bottom:8px}.meta{font-size:13px;color:#596275;line-height:1.6}.card a{margin-top:auto;padding-top:15px;color:#3157d5;font-weight:bold;text-decoration:none}
.empty{text-align:center;padding:50px;color:#687083}
@media(max-width:800px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}}
@media(max-width:500px){.controls{grid-template-columns:1fr}}
</style>
</head>
<body>

"Highly Competitive", "Link": "https://haas.berkeley.edu/business-academy/high-school/high-school-entrepreneurship/"}, {"Title": "California DECA", "Category": "Business & Leadership", "Organization": "California DECA", "Location": "California (Bay Area Chapters)", "Type": "Competition", "Grade Level": " High School", "Paid/Volunteer": "Volunteer", "Difficulty": "Moderate", "Link": "https://californiadeca.org/"}, {"Title": "Coro Northern California – Youth Fellows Program", "Category": "Business & Leadership", "Organization": "Coro Northern California", "Location": "San Francisco, CA", "Type": "Leadership Program", "Grade Level": "High School", "Paid/Volunteer": "Free", "Difficulty": "Competitive", "Link": "https://coroca.org/programs/"}, {"Title": "All Stars Project – Development School for Youth", "Category": "Business & Leadership", "Organization": "All Stars Project", "Location": "San Francisco, CA", "Type": "Leadership Program", "Grade Level": "High School", "Paid/Volunteer": "Free", "Difficulty": "Moderate", "Link": "https://allstars.org/"}, {"Title": "Berkeley M.E.T. Innovation Academy", "Category": "Business & Leadership", "Organization": "UC Berkeley M.E.T.", "Location": "Berkeley, CA", "Type": "Innovation Program", "Grade Level": "High School", "Paid/Volunteer": "Tuition Required", "Difficulty": "Highly Competitive", "Link": "https://met.berkeley.edu/"}, {"Title": "NFTE West (Northern California) Youth Entrepreneurship Challenge", "Category": "Business & Leadership", "Organization": "Network for Teaching Entrepreneurship (NFTE)", "Location": "San Francisco Bay Area", "Type": "Entrepreneurship Competition", "Grade Level": "High School", "Paid/Volunteer": "Free", "Difficulty": "Competitive", "Link": "https://nfte.com/"}, {"Title": "Diamond Challenge – UC Berkeley Regional Competition", "Category": "Business & Leadership", "Organization": "Diamond Challenge / UC Berkeley", "Location": "Berkeley, CA", "Type": "Business Competition", "Grade Level": "High School", "Paid/Volunteer": "Free", "Difficulty": "Competitive", "Link": "https://diamondchallenge.org/"}, {"Title": "Young Entrepreneurs Academy (YEA!) – East Bay", "Category": "Business & Leadership", "Organization": "Young Entrepreneurs Academy", "Location": "East Bay, CA", "Type": "Entrepreneurship Program", "Grade Level": "Middle & High School", "Paid/Volunteer": "Tuition Required", "Difficulty": "Competitive", "Link": "https://yeausa.org/"}, {"Title": "Lawrence Hall of Science – Teen Research Programs", "Category": "Science & Research", "Organization": "Lawrence Hall of Science", "Location": "Berkeley, CA", "Type": "Research Program", "Grade Level": "High School", "Paid/Volunteer": "Free", "Difficulty": "Competitive", "Link": "https://lawrencehallofscience.org/visitors/teen-research-programs/"}, {"Title": "Headwaters Science Institute – Field Research Program", "Category": "Science & Research", "Organization": "Headwaters Science Institute", "Location": "Northern California", "Type": "Research Program", "Grade Level": "High School", "Paid/Volunteer": "Tuition Required", "Difficulty": "Competitive", "Link": "https://headwatersscienceinstitute.org/"}, {"Title": "Synopsys Championship (Silicon Valley Science & Technology Championship)", "Category": "Science & Research", "Organization": "Synopsys Championship", "Location": "San Jose, CA", "Type": "Science Competition", "Grade Level": "Grades 6–12", "Paid/Volunteer": "Free", "Difficulty": "Highly Competitive", "Link": "https://science-fair.org/"}, {"Title": "Joint Genome Institute (JGI)", "Category": "Science & Research", "Organization": "Joint Genome Institute", "Location": "Berkeley, CA", "Type": "Research Opportunity", "Grade Level": "High School", "Paid/Volunteer": "Free", "Difficulty": "Highly Competitive", "Link": "https://jgi.doe.gov/"}, {"Title": "Golden Gate National Recreation Area Internship", "Category": "Science & Research", "Organization": "Golden Gate National Parks Conservancy", "Location": "San Francisco, const fields = {
  category: [...new Set(opportunities.map(x=>String(x["Category"]||"").trim()).filter(Boolean))].sort(),
  grade: [...new Set(opportunities.map(x=>String(x["Grade Level"]||"").trim()).filter(Boolean))].sort(),
  type: [...new Set(opportunities.map(x=>String(x["Type"]||"").trim()).filter(Boolean))].sort(),
  paid: [...new Set(opportunities.map(x=>String(x["Paid/Volunteer"]||"").trim()).filter(Boolean))].sort()
};

function fill(id, values){
  const el=document.getElementById(id);
  values.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;el.appendChild(o)});
}
fill("category",fields.category); fill("grade",fields.grade); fill("type",fields.type); fill("paid",fields.paid);

function render(){
  const q=document.getElementById("search").value.toLowerCase().trim();
  const filters={category:document.getElementById("category").value,grade:document.getElementById("grade").value,type:document.getElementById("type").value,paid:document.getElementById("paid").value};
  const filtered=opportunities.filter(x=>{
    const text=Object.values(x).join(" ").toLowerCase();
    return (!q||text.includes(q))
      &&(!filters.category||String(x["Category"]||"").trim()===filters.category)
      &&(!filters.grade||String(x["Grade Level"]||"").trim()===filters.grade)
      &&(!filters.type||String(x["Type"]||"").trim()===filters.type)
      &&(!filters.paid||String(x["Paid/Volunteer"]||"").trim()===filters.paid);
  });

  document.getElementById("count").textContent=`Showing ${filtered.length} of ${opportunities.length} opportunities`;
  const results=document.getElementById("results");
  if(!filtered.length){results.innerHTML='<div class="empty">No opportunities match those filters.</div>';return}

  results.innerHTML=filtered.map(x=>{
    const link=String(x["Link"]||"").trim();
    return `<article class="card">
      <div class="badges">
        ${x["Category"]?`<span class="badge">${esc(x["Category"])}</span>`:""}
        ${x["Paid/Volunteer"]?`<span class="badge">${esc(x["Paid/Volunteer"])}</span>`:""}
      </div>
      <h2>${esc(x["Title"]||"Untitled opportunity")}</h2>
      <div class="org">${esc(x["Organization"]||"")}</div>
      <div class="meta">
        ${x["Location"]?`📍 ${esc(x["Location"])}<br>`:""}
        ${x["Grade Level"]?`🎓 ${esc(x["Grade Level"])}<br>`:""}
        ${x["Type"]?`📌 ${esc(x["Type"])}<br>`:""}
        ${x["Difficulty"]?`⭐ ${esc(x["Difficulty"])}`:""}
      </div>
      ${link?`<a href="${esc(link)}" target="_blank" rel="noopener">View opportunity →</a>`:""}
    </article>`;
  }).join("");
}

function esc(v){
  return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
document.querySelectorAll("input,select").forEach(el=>el.addEventListener("input",render));
render();
</script>
</body>
</html>
